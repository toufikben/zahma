[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zahma"
version = "0.1.0"
description = "Traffic prediction and departure advisor for Algiers"
requires-python = ">=3.11"
dependencies = [
    # OSM reading — pyrosm is the only one we actually import.
    # osmnx was listed but never imported; it pulls a heavy geo stack
    # (matplotlib, rasterio, folium) that CI does not need.
    "pyrosm>=0.6.2",
    "networkx>=3.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
zahma = "zahma.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
